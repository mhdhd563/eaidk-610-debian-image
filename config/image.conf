# EAIDK-610 镜像构建参数
#
# 这些是本次构建 / 本仓库镜像实际使用的值。所有脚本都 source 这个文件。
# 改动前请先读 docs/01-design-plan.md。

# ---------- 版本 / 包 ----------
KVER="6.1.0-53-arm64"                 # Debian bookworm 内核 ABI 版本
KERNEL_DEB="linux-image-6.1.0-53-arm64"
UBOOT_VER="v2024.10"                  # 已验证含 eaidk-610-rk3399_defconfig
UBOOT_DEFCONFIG="eaidk-610-rk3399_defconfig"
LINUX_TAG="v6.1.187"                  # 编译 rt5651 模块用的上游源码 tag（与 KVER 同版本）

# ---------- 镜像标识 ----------
HOSTNAME="eaidk-610"
ROOT_UUID="230a0279-8991-4499-8b75-ab2c3a8fdacb"
BOOT_VOLID="1A2B3C4D"                 # mkfs.vfat -i，显示为 1A2B-3C4D
BOOT_LABEL="BOOT"
ROOT_LABEL="armbi_root"
BOARD_DTB="rk3399-eaidk-610.dtb"

# ---------- 分区布局（单位：512 字节扇区 / MiB）----------
IDB_SEEK=64                           # 32 KiB  idbloader.img（DDR 初始化 + BL31 + SPL）
ITB_SEEK=16384                        # 8 MiB   u-boot.itb
P1_START_MIB=16                       # FAT32 启动分区
P1_SIZE_MIB=256
P2_START_MIB=272                      # ext4 根分区
ROOT_EXTRA_MIB=2048                   # 根分区在原占用之外多留的余量

# ---------- 内核 cmdline ----------
# console=ttyS2,1500000 是这块板的调试串口（UART2 @1.5M），必须带，否则串口无输出
CMDLINE="rootfstype=ext4 rootwait rw console=ttyS2,1500000 console=tty0 net.ifnames=0"

# ---------- 默认账号（首启后请立即修改）----------
USER_NAME="debian"
USER_PASS="debian"
ROOT_PASS="root"